[workspace]
members = [".", "examples/stm32-embassy-example"]

[package]
authors = [
    "Radosław Wolański <radekw8733@gmail.com>",
    "Brandon Saint-John <branstj@gmail.com>",
]
license = "Apache-2.0"
name = "arducam-legacy"
description = "Driver for Arducam legacy cameras based on embedded-hal"
categories = [
    "hardware-support",
    "embedded",
    "computer-vision",
    "no-std::no-alloc",
    "multimedia::images",
]
keywords = ["embedded", "embedded-hal", "arducam", "ov2640"]
version = "0.2.0"
edition = "2021"
repository = "https://github.com/radekw8733/arducam-legacy"
readme = "README.md"

[dependencies]
defmt = "1.0.1"
embedded-hal-1 = { package = "embedded-hal", version = "1"}
embedded-hal-async = "1.0.0"
thiserror = { version = "2.0.16", default-features = false }
