[package]
name = "stm32-embassy-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m-rt = "0.7.5"
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }

embassy-stm32 = { version = "0.4.0", features = [
    "defmt",
    "time-driver-any",
    "stm32u083rc",
    "memory-x",
    "unstable-pac",
    "exti",
    "chrono",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-executor = { version = "0.9.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
] }
arducam-legacy = { version = "0.2", path = "../.." }